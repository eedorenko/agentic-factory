name: Auto-dispatch to Copilot

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  dispatch:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to Copilot
        uses: otto-de/assign_issue_toCopilot_action@main
        with:
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ secrets.COPILOT_PAT }}
