name: Orchestrator Heartbeat
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/dispatches" -X POST --input - <<'PAYLOAD' || echo "dispatch failed"
          {"event_type": "orchestrator-heartbeat", "client_payload": {"trigger": "heartbeat"}}
          PAYLOAD
